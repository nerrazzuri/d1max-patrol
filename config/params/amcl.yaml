map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/tmp/d1max_map_rect.yaml"
    frame_id: "rect_map"
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: "rect_map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    scan_topic: "/laser_scan"
    set_initial_pose: true
    initial_pose: {x: -1.13, y: -1.31, z: 0.0, yaw: 0.0}
    max_particles: 3000
    min_particles: 800
    laser_max_range: 15.0
    laser_min_range: 0.3
    max_beams: 180
    update_min_d: 0.1
    update_min_a: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
