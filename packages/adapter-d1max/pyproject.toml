[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexwar_adapter_d1max"
version = "1.0.0-rc.1"
description = "真狗 D1 Max 的 RobotHAL:经 TCP 接常驻 SDK 旁路进程(patrol_agent)"
requires-python = ">=3.10"
# 过渡性依赖根包的 backends.sidecar_device 与 protocol.agent_frames(同 robot-agent)。
dependencies = ["nexwar_contract", "nexwar_patrol"]

[tool.setuptools.packages.find]
where = ["src"]
