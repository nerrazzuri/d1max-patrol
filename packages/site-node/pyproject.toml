[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexwar_site_node"
version = "1.0.0-rc.1"
description = "现场节点(站点):broker 配置与设备认证、派遣器、站点 API(总设计 §1、W00c)"
requires-python = ">=3.10"
# 只依赖契约包;不依赖根包 nexwar_patrol —— 老 HTTP 面归 W00c4 退役。
dependencies = ["nexwar_contract[mqtt,planning]"]

[project.scripts]
nexwar_site = "nexwar_site.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# 商业化 B1:网页值班台(web/console 构建出来的静态文件)跟着站点包装
[tool.setuptools.package-data]
nexwar_site = ["web/*.html", "web/assets/*"]
