[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d1max-robot-agent"
version = "0.1.0"
description = "跑在狗上的机器人代理:契约运行时(W00),engine/ 随 W00b 搬入"
requires-python = ">=3.10"
# d1max-patrol 是**过渡性**依赖:engine/ 还用着根包的 protocol.nav_types 与
# backends.base(NavBackend/DeviceBackend)。W00d 出 adapter-d1max、backends 按 RobotHAL
# 重做之后切掉。
dependencies = [
    "d1max-contract",
    "d1max-patrol",
    # W10 规划桥(bridges/planned_nav)、W11 障碍(obstacles)、契约的规划代价图都 import numpy,而且
    # assembly 一导入就带进来:不声明的话狗上 install.sh 装出来的 venv 里没有它,代理连 --help 都起不来
    # (2026-10-08 现场装 C40221 前查出;开发环境一直碰巧有 numpy,测试盖不住)。离线轮子同步加了 2.2.6。
    "numpy>=1.21",
]

[project.scripts]
d1max-agent = "d1max_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
