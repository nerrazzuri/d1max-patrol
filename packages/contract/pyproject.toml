[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d1max-contract"
version = "0.1.0"
description = "狗 ↔ 站点的唯一契约:报文数据类、主题与 ACL、RobotHAL、Transport、派遣客户端"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# PahoTransport 才用得着;MemoryBroker 和全部数据类不需要它。狗上离线装:
# paho_mqtt-2.x 是一个 py3-none-any 轮子。
mqtt = ["paho-mqtt>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
