# 还没验收、现在编不过的平台(RC0):单独一个工作流,红了不影响 ci 的结论。
# macOS 桌面版要不要继续支持(决策 28 当时说了要)由用户定;定了要就修好挪回 ci.yml。
# macOS 桌面版:2026-10-11 起编不过(video_player_avfoundation: module 'Flutter' not found),没修。
# iOS(RC 加固 H13):基础工程,只验「不签名能编过」;没有苹果开发者账号,不签名、不出包、不推送。
# 只在合进 master、手动触发时跑(macOS 机器按十倍计费)。
name: experimental

# 决策 59(2026-10-12):RC 的支持平台不含 macOS,以后开 iOS 时一起修。改成只手动触发:
# 不再每次合进 master 都红一次(macOS 机器按十倍计费)。
on:
  workflow_dispatch:

concurrency:
  group: experimental-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: 装 Flutter 3.47.5(官方仓库,按标签)
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: mobile
        run: flutter config --enable-macos-desktop && flutter pub get
      - working-directory: mobile
        run: flutter build macos --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: d1max-desktop-macos
          path: mobile/build/macos/Build/Products/Release/d1max_patrol.app
          retention-days: 14

  # H13:iOS 基础工程编得过不过。不签名(没有开发者账号),只编 debug;不上传产物(没签名的包装不到手机上)。
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: 装 Flutter 3.47.5(官方仓库,按标签)
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version && xcodebuild -version
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter build ios --debug --no-codesign
