# 还没验收、现在编不过的平台(RC0):单独一个工作流,红了不影响 ci 的结论。
# macOS 桌面版要不要继续支持(决策 28 当时说了要)由用户定;定了要就修好挪回 ci.yml。
# 现在只有 macOS 桌面版:2026-10-11 起编不过(video_player_avfoundation: module 'Flutter' not found),没修。
# 只在合进 master、手动触发时跑(macOS 机器按十倍计费)。
name: experimental

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: experimental-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: 装 Flutter 3.47.5(官方仓库,按标签)
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: mobile
        run: flutter config --enable-macos-desktop && flutter pub get
      - working-directory: mobile
        run: flutter build macos --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: d1max-desktop-macos
          path: mobile/build/macos/Build/Products/Release/d1max_patrol.app
          retention-days: 14
