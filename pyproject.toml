[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d1max-patrol"
version = "0.1.0"
description = "智元 D1 Max 四足机器人巡检与例检系统"
requires-python = ">=3.10"
dependencies = [
    # MIN-10: 下界 `>=13` 是设计文档的全局约束(新版 asyncio 接口
    # `websockets.asyncio.client` / `.server` 是 13.0 落地的),不动。
    # 但要如实记账: 本卷**实际验证过的只有 16.0**,13.x/14.x/15.x 从未跑过
    # 一次测试。13.x 的 CI 矩阵留给第 2 卷;在那之前,"支持 13"是声明,不是证据。
    "websockets>=13",
    "PyYAML>=6.0",
    # 时区必须跟着我们的包走,不能靠系统的 /usr/share/zoneinfo —— §3.3 第 1 条
    # 点名的威胁(刷机、OTA、换主板)恰恰就是会把系统时区库一起抹掉的那几件事。
    # Windows 上 zoneinfo 更是没有它一个时区都解不出来。
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
d1max = "d1max_patrol.cli:main"
d1max-app = "d1max_patrol.app.server:main"

[tool.setuptools.packages.find]
where = ["src"]

# 网页面板的静态文件不是 .py, setuptools 默认不往 wheel 里放 —— 装机脚本
# pip install 完, ``/`` 和 ``/static/*`` 就是 404。子目录要加就在这里加一行,
# ``tests/test_packaging.py`` 会逐个核对 static 底下的文件都进了 wheel。
[tool.setuptools.package-data]
"d1max_patrol.app" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "contract: 实现无关的行为约定(后端 target、形态 target)",
    "scenarios: 故障注入与降级行为(慢,与实现耦合)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# MIN-7: BLE 必须在这里启用。启用之前,代码里那 8 处 `# noqa: BLE001`
# 是**空注解** —— BLE 没进 select,它们一条规则都没抑制,却让读代码的人以为
# "这处宽捕获已经被 linter 认可过了"。启用后的爆炸半径已实测: 只多出 2 条
# 命中(都在 d1max_sim/nav_server.py,均为有意的宽捕获且已有日志),已就地补
# noqa。
# RUF100 是 MIN-7 的第二半:它禁止"空注解"本身。光把 BLE 打开还不够 ——
# 实测启用 BLE 之后,原来那 8 处 `# noqa: BLE001` 里仍有 5 处是无效注解
# (ruff 的 BLE001 对"把异常记进日志/原样再抛"的处理器本来就不报),
# 也就是说它们抑制的规则根本没有命中过。RUF100 会把这类注解当错误报出来,
# 于是"注解上写着的规则确实存在"这件事从此有人守。爆炸半径: 清掉那 5 处
# 之后为 0 命中。
select = ["E", "F", "I", "UP", "B", "BLE", "RUF100"]
